name: my_music_player
description: "Un reproductor de música completo para almacenamiento interno y tarjeta SD."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  permission_handler: ^11.3.0
  provider: ^6.1.2

icons_launcher:
  image_path: "assets/icono.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true
